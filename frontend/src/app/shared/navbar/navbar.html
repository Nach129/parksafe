

<header class="navbar">
  <div class="navbar-container">
    <a routerLink="/inicio" class="brand" (click)="closeMenu()">
      <div class="brand-icon">P</div>

      <div class="brand-text">
        <strong>ParkSafe</strong>
        <span>Estacionamiento inteligente</span>
      </div>
    </a>

    <!-- Boton de accion: ejecuta el flujo definido en el componente TypeScript. -->

    <!-- Boton de accion: ejecuta el metodo enlazado en el componente TypeScript. -->
    <button type="button" class="menu-button" (click)="toggleMenu()" aria-label="Abrir menú">
      ☰
    </button>
    <!-- Navegacion principal: permite moverse entre flujos de registro, login, reservas y estado del sistema. -->

    <nav class="nav-links" [class.open]="menuOpen">
      <a routerLink="/inicio" routerLinkActive="active" (click)="closeMenu()"> Inicio </a>

      <a routerLink="/vehiculos" routerLinkActive="active" (click)="closeMenu()"> Mis vehículos </a>

      <a routerLink="/estacionamiento" routerLinkActive="active" (click)="closeMenu()">
        Estacionamiento
      </a>

      <a routerLink="/mis-reservas" routerLinkActive="active" (click)="closeMenu()">
        Mis reservas
      </a>

      <a routerLink="/estado-sistema" routerLinkActive="active" (click)="closeMenu()"> Sistema </a>

      <!-- Boton de accion: ejecuta el metodo enlazado en el componente TypeScript. -->
      <button type="button" class="logout-button" (click)="logout()">Cerrar sesión</button>
    </nav>
  </div>
</header>
